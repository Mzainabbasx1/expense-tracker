<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --income: #3fb950;
    --expense: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .container { max-width: 600px; margin: 0 auto; }

  h1 { text-align: center; font-size: 28px; margin-bottom: 24px; }

  /* Balance card */
  .balance-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 20px;
  }
  .balance-card .label { color: var(--text-secondary); font-size: 14px; margin-bottom: 6px; }
  .balance-card .amount { font-size: 36px; font-weight: 700; }

  .summary-row { display: flex; gap: 16px; margin-bottom: 24px; }
  .summary-box {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; text-align: center;
  }
  .summary-box .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  .summary-box .value { font-size: 20px; font-weight: 600; }
  .income-text { color: var(--income); }
  .expense-text { color: var(--expense); }

  /* Form */
  .form-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 24px;
  }
  .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
  input, select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 6px; font-size: 14px; flex: 1;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .type-btn {
    flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-secondary); cursor: pointer; font-size: 14px;
  }
  .type-btn.active-income { background: rgba(63,185,80,0.15); border-color: var(--income); color: var(--income); }
  .type-btn.active-expense { background: rgba(248,81,73,0.15); border-color: var(--expense); color: var(--expense); }
  button.add-btn {
    width: 100%; padding: 12px; background: var(--accent); color: #0d1117;
    border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button.add-btn:hover { opacity: 0.9; }

  /* Transaction list */
  .list-title { font-size: 16px; margin-bottom: 12px; color: var(--text-secondary); }
  .transaction {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 10px;
  }
  .transaction .info { display: flex; flex-direction: column; }
  .transaction .cat { font-size: 14px; font-weight: 500; }
  .transaction .sub { font-size: 12px; color: var(--text-secondary); }
  .transaction .right { display: flex; align-items: center; gap: 12px; }
  .transaction .amt { font-weight: 600; font-size: 15px; }
  .delete-btn {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 16px; padding: 4px;
  }
  .delete-btn:hover { color: var(--expense); }
  .empty-state { text-align: center; color: var(--text-secondary); padding: 30px 0; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
  <h1>💰 Expense Tracker</h1>

  <div class="balance-card">
    <div class="label">Total balance</div>
    <div class="amount" id="balance">Rs 0</div>
  </div>

  <div class="summary-row">
    <div class="summary-box">
      <div class="label">Income</div>
      <div class="value income-text" id="totalIncome">Rs 0</div>
    </div>
    <div class="summary-box">
      <div class="label">Expense</div>
      <div class="value expense-text" id="totalExpense">Rs 0</div>
    </div>
  </div>

  <div class="form-card">
    <div class="type-toggle">
      <button class="type-btn active-income" id="incomeBtn" onclick="setType('income')">Income</button>
      <button class="type-btn" id="expenseBtn" onclick="setType('expense')">Expense</button>
    </div>
    <div class="form-row">
      <input type="text" id="category" placeholder="Category (e.g. Food, Salary)">
      <input type="number" id="amount" placeholder="Amount">
    </div>
    <button class="add-btn" onclick="addTransaction()">Add transaction</button>
  </div>

  <div class="list-title">Recent transactions</div>
  <div id="transactionList"></div>
</div>

<script>
  let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
  let currentType = 'income';

  function setType(type) {
    currentType = type;
    document.getElementById('incomeBtn').className = 'type-btn' + (type === 'income' ? ' active-income' : '');
    document.getElementById('expenseBtn').className = 'type-btn' + (type === 'expense' ? ' active-expense' : '');
  }

  function addTransaction() {
    const category = document.getElementById('category').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);

    if (!category || isNaN(amount) || amount <= 0) {
      alert('Please enter a valid category and amount.');
      return;
    }

    transactions.push({
      id: Date.now(),
      type: currentType,
      category: category,
      amount: amount,
      date: new Date().toLocaleDateString()
    });

    localStorage.setItem('transactions', JSON.stringify(transactions));
    document.getElementById('category').value = '';
    document.getElementById('amount').value = '';
    render();
  }

  function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    localStorage.setItem('transactions', JSON.stringify(transactions));
    render();
  }

  function render() {
    const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
    const expense = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
    const balance = income - expense;

    document.getElementById('balance').textContent = 'Rs ' + balance.toLocaleString();
    document.getElementById('totalIncome').textContent = 'Rs ' + income.toLocaleString();
    document.getElementById('totalExpense').textContent = 'Rs ' + expense.toLocaleString();

    const list = document.getElementById('transactionList');
    if (transactions.length === 0) {
      list.innerHTML = '<div class="empty-state">No transactions yet. Add your first one above.</div>';
      return;
    }

    list.innerHTML = transactions.slice().reverse().map(t => `
      <div class="transaction">
        <div class="info">
          <span class="cat">${t.category}</span>
          <span class="sub">${t.date}</span>
        </div>
        <div class="right">
          <span class="amt ${t.type === 'income' ? 'income-text' : 'expense-text'}">
            ${t.type === 'income' ? '+' : '-'}Rs ${t.amount.toLocaleString()}
          </span>
          <button class="delete-btn" onclick="deleteTransaction(${t.id})">✕</button>
        </div>
      </div>
    `).join('');
  }

  render();
</script>

</body>
</html>
